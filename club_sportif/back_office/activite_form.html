<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire activité - BackOffice</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header class="navbar" id="navbar">
        <div class="navbar__inner">
            <a href="../FrontOffice/index.html" class="navbar__brand" id="logo">
                <img src="../assets/img/logo.png" alt="Club Sportif - Accueil">
            </a>
            <nav class="navbar__links">
                <a href="../FrontOffice/index.html">Retour au site</a>
            </nav>
        </div>
    </header>
    <div class="backoffice-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">BackOffice</div>
            <ul class="sidebar-nav">
                <li><a href="activites-liste.html">Activités</a></li>
                <li><a href="activite-form.html" class="active">Nouvelle activité</a></li>
                <li><a href="adherents-liste.html">Adhérents</a></li>
                <li><a href="adherent-form.html">Nouvel adhérent</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <h1>Formulaire activité</h1>
            <form class="form-card" id="form-activite" action="#" method="post">
                <label for="nom">Nom de l'activité</label>
                <input type="text" id="nom" name="nom" required minlength="3" maxlength="50"
                       pattern="[A-Za-z0-9À-ÿ ]+" title="Lettres, chiffres et espaces uniquement (3 à 50 caractères)">

                <label for="categorie">Catégorie</label>
                <select id="categorie" name="categorie" required>
                    <option value="">Choisir une catégorie</option>
                    <option value="Fitness">Fitness</option>
                    <option value="Bien-être">Bien-être</option>
                    <option value="Sport aquatique">Sport aquatique</option>
                    <option value="Cardio">Cardio</option>
                    <option value="Sport collectif">Sport collectif</option>
                </select>

                <label for="description">Description</label>
                <textarea id="description" name="description" rows="4" required maxlength="300"
                          placeholder="Décrivez l'activité (300 caractères maximum)."></textarea>

                <div class="form-row">
                    <div>
                        <label for="jour">Jour</label>
                        <select id="jour" name="jour" required>
                            <option value="">Choisir un jour</option>
                            <option value="Lundi">Lundi</option>
                            <option value="Mardi">Mardi</option>
                            <option value="Mercredi">Mercredi</option>
                            <option value="Jeudi">Jeudi</option>
                            <option value="Vendredi">Vendredi</option>
                            <option value="Samedi">Samedi</option>
                            <option value="Dimanche">Dimanche</option>
                        </select>
                    </div>
                    <div>
                        <label for="horaire">Horaire</label>
                        <input type="text" id="horaire" name="horaire" required placeholder="08:30 - 10:00"
                               pattern="([01][0-9]|2[0-3]):[0-5][0-9] - ([01][0-9]|2[0-3]):[0-5][0-9]" title="Format attendu : HH:MM - HH:MM (ex : 08:30 - 10:00)">
                    </div>
                </div>

                <div class="form-row">
                    <div>
                        <label for="tarif">Tarif (DT/mois)</label>
                        <input type="number" id="tarif" name="tarif" required min="0" max="1000" step="0.01">
                    </div>
                    <div>
                        <label for="places">Nombre de places</label>
                        <input type="number" id="places" name="places" required min="1" max="200" step="1">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="btn-enregistrer">Enregistrer</button>
                    <a href="activites-liste.html" class="btn btn-secondary">Annuler</a>
                </div>
            </form>
        </main>
    </div>
    <footer class="footer" id="footer">
        <div class="footer-container">
            <div class="footer-bottom">
                <p>&copy; 2026 Club Sportif - BackOffice - Tous droits réservés</p>
            </div>
        </div>
    </footer>
</body>
</html>
